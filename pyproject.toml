[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore"
version = "0.2.0"
description = "Installer and registry client for versioned knowledge packages"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.scripts]
lore = "lore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
